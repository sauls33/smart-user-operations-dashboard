<tr>
  <th>Name</th>
  <th>Email</th>
  <th>Role</th>
  <th>Department</th>
  <th>Last Login</th>
  <th>Risk</th>
  <th>Actions</th>
</tr>

<tr *ngFor="let user of users">
  <td>{{ user.name }}</td>
  <td>{{ user.email }}</td>
  <td>{{ user.role }}</td>
  <td>{{ user.department }}</td>
  <td>{{ user.lastLoginDate }}</td>
  <td>{{ user.riskLevel }}</td>

  <td>
    <button (click)="edit.emit(user)">Edit</button>
    <button (click)="remove.emit(user)">Delete</button>
  </td>
</tr>
